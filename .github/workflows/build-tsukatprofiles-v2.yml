name: Build TsukatProfiles 0.2.0 v2

on:
  push:
    paths:
      - '.github/workflows/build-tsukatprofiles-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Restore source snapshot
        shell: bash
        run: |
          mkdir -p build
          cat > build/source.b64 <<'EOF'
          
          EOF
          base64 -d build/source.b64 > build/source.zip
          unzip -q build/source.zip -d build/project

      - name: Create Maven build
        shell: bash
        run: |
          cat > build/project/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.tsukat</groupId>
            <artifactId>TsukatProfiles</artifactId>
            <version>0.2.0</version>
            <properties>
              <maven.compiler.release>25</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>26.2.build.129-stable</version>
                <scope>provided</scope>
              </dependency>
              <dependency>
                <groupId>org.xerial</groupId>
                <artifactId>sqlite-jdbc</artifactId>
                <version>3.53.4.0</version>
              </dependency>
            </dependencies>
            <build>
              <finalName>TsukatProfiles-0.2.0</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.1</version>
                  <configuration>
                    <release>25</release>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.6.1</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals><goal>shade</goal></goals>
                      <configuration>
                        <createDependencyReducedPom>false</createDependencyReducedPom>
                        <filters>
                          <filter>
                            <artifact>*:*</artifact>
                            <excludes>
                              <exclude>META-INF/*.SF</exclude>
                              <exclude>META-INF/*.DSA</exclude>
                              <exclude>META-INF/*.RSA</exclude>
                            </excludes>
                          </filter>
                        </filters>
                        <transformers>
                          <transformer implementation="org.apache.maven.plugins.shade.resource.ServicesResourceTransformer"/>
                        </transformers>
                      </configuration>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POM

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        working-directory: build/project
        run: mvn -B -U clean package

      - name: Verify JAR
        shell: bash
        run: |
          test -f build/project/target/TsukatProfiles-0.2.0.jar
          jar tf build/project/target/TsukatProfiles-0.2.0.jar | grep -q '^plugin.yml$'
          jar tf build/project/target/TsukatProfiles-0.2.0.jar | grep -q '^com/tsukat/profile/TsukatProfilesPlugin.class$'
          jar tf build/project/target/TsukatProfiles-0.2.0.jar | grep -q '^org/sqlite/JDBC.class$'
          unzip -p build/project/target/TsukatProfiles-0.2.0.jar plugin.yml

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: TsukatProfiles-0.2.0
          path: build/project/target/TsukatProfiles-0.2.0.jar
          if-no-files-found: error
